name: Publish container image

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Smoke test and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Fast, offline, no API keys. Runs before the image build so a logic
      # regression fails in seconds rather than after a multi-arch build.
      - name: Run unit tests
        run: python -m pytest tests/test_db.py tests/test_llm.py tests/test_recommender.py -q

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        run: |
          tests/e2e/harness.sh start
          python -m pytest tests/e2e/test_ui.py -q
          tests/e2e/harness.sh stop

      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jellylook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name jellylook-ci -p 8000:8000 \
            -e HISTORY_SOURCE=jellystat \
            -e JELLYSTAT_API_KEY=ci-dummy \
            -e JELLYFIN_API_KEY=ci-dummy \
            -e TMDB_API_KEY=ci-dummy \
            -e OMDB_API_KEY=ci-dummy \
            -e LLM_PROVIDER=anthropic \
            -e ANTHROPIC_API_KEY=ci-dummy \
            -e SEERR_URL=http://127.0.0.1:9 \
            jellylook:ci

      - name: Wait for the health endpoint
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "health endpoint is up"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          exit 1

      - name: Check the UI and API respond
        run: |
          curl -fsS -o /dev/null -w 'index.html %{http_code}\n' http://127.0.0.1:8000/
          curl -fsS -o /dev/null -w 'app.js     %{http_code}\n' http://127.0.0.1:8000/app.js
          curl -fsS http://127.0.0.1:8000/api/status | tee /tmp/status.json
          grep -q '"provider":"anthropic"' /tmp/status.json
          curl -fsS http://127.0.0.1:8000/api/settings | grep -q 'default_sort'

      - name: Check the container reports itself healthy
        run: |
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' jellylook-ci)
            echo "health: $state"
            [ "$state" = "healthy" ] && exit 0
            [ "$state" = "unhealthy" ] && exit 1
            sleep 5
          done
          echo "HEALTHCHECK never reported healthy"
          exit 1

      - name: Check startup fails fast on missing configuration
        run: |
          set +e
          docker run --rm jellylook:ci > /tmp/badconf.log 2>&1
          status=$?
          set -e
          cat /tmp/badconf.log
          if [ "$status" -eq 0 ]; then
            echo "expected a non-zero exit when required keys are missing"
            exit 1
          fi
          grep -q "TMDB_API_KEY required" /tmp/badconf.log

      - name: Container logs
        if: always()
        run: docker logs jellylook-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f jellylook-ci || true

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
